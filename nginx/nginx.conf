# Canvasphere 4C8G Production Nginx Reverse Proxy
# Handles API, SSE zero-buffering streams, dual MCP endpoints, and Yjs WebSockets.

upstream canvasphere_api {
    server api:8000;
    keepalive 32;
}

upstream canvasphere_yjs {
    server yjs:1234;
}

server {
    listen 80;
    server_name _;

    # Support cover videos (<= 50 MiB) & skill zip uploads (<= 10 MiB)
    client_max_body_size 64m;

    # SSE real-time canvas events & Studio chat streaming: disable buffering & allow 1h idle keepalive
    location ~ ^/api/projects/[^/]+/canvases/[^/]+/(events|studio/chat/stream)$ {
        proxy_pass http://canvasphere_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Dual Streamable-HTTP MCP servers (/mcp/canvas/, /mcp/pecan/, /mcp/)
    location /mcp/ {
        proxy_pass http://canvasphere_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # OAuth 2.0 DCR discovery + core REST API + health + Prometheus metrics
    location ~ ^/(api|health|metrics|\.well-known) {
        proxy_pass http://canvasphere_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Yjs WebSocket collaboration (passes ?token= or Authorization header for JWT room auth)
    location /yjs/ {
        proxy_pass http://canvasphere_yjs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
    }
}

