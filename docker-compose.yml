# Canvasphere Server —— 4 vCPU / 8 GiB RAM 轻量生产编排
# 常驻内存约 1.2–1.6 GiB，总容器硬上限 3.84 GiB，为系统内核、FFmpeg 与并发沙盒留足 ~3.4 GiB 余量。
# 使用前：cp .env.example .env，填好 JWT_SECRET / POSTGRES_PASSWORD / LLM 等真实值后再 up。

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      yjs:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - E2B_API_KEY=${E2B_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql://canvas:canvas@db:5432/canvas}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ASYNC_WORKER_ENABLED=${ASYNC_WORKER_ENABLED:-true}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - SANDBOX_MAX_CONCURRENT=${SANDBOX_MAX_CONCURRENT:-2}
      - SANDBOX_DOCKER_MEMORY=${SANDBOX_DOCKER_MEMORY:-512m}
      - SANDBOX_DOCKER_CPUS=${SANDBOX_DOCKER_CPUS:-0.5}
      - FFMPEG_THREADS=${FFMPEG_THREADS:-2}
      - AUTH_ALLOW_LEGACY_ROLE_HEADER=${AUTH_ALLOW_LEGACY_ROLE_HEADER:-false}
      - LOCAL_STORAGE_DIR=${LOCAL_STORAGE_DIR:-/data/storage}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - storage_data:/data/storage
      - ./skills:/skills:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - DATABASE_URL=${DATABASE_URL:-postgresql://canvas:canvas@db:5432/canvas}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ASYNC_WORKER_ENABLED=true
      - DB_POOL_SIZE=3
      - DB_MAX_OVERFLOW=5
      - FFMPEG_THREADS=${FFMPEG_THREADS:-2}
      - FFMPEG_MAX_CONCURRENT=${FFMPEG_MAX_CONCURRENT:-1}
      - LOCAL_STORAGE_DIR=${LOCAL_STORAGE_DIR:-/data/storage}
    volumes:
      - storage_data:/data/storage
      - ./skills:/skills:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  yjs:
    build: ./yjs
    environment:
      - HOST=0.0.0.0
      - PORT=1234
    ports:
      - "1234:1234"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-canvas}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-canvas}
      - POSTGRES_DB=${POSTGRES_DB:-canvas}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "max_connections=60"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-canvas} -d ${POSTGRES_DB:-canvas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1200m
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

volumes:
  pgdata:
  redis_data:
  storage_data:
